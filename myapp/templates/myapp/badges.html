{% extends "myapp/base.html" %}

{% block content %}
<div class="container mt-5">

    <!-- Centered column like Create Post page -->
    <div class="col-md-8 mx-auto text-center">

        <!-- Title (25% bigger + spaced + centered) -->
        <h1 style="font-size: 3.75rem; margin-bottom: 20px; font-weight: 600;">
            Badges
        </h1>

        <!-- Pronounced divider with shadow -->
        <hr style="
            width: 60%;
            margin: 0 auto 35px auto;
            height: 3px;
            background-color: #444;
            border: none;
            box-shadow: 0px 2px 6px rgba(0,0,0,0.2);
        ">

        {% if badges %}
            <div class="row mt-4 justify-content-center">
                {% for badge in badges %}
                    <div class="col-md-4 mb-4">
                        <div class="card text-center h-100">
                            {% if badge.image %}
                                <img src="{{ badge.image.url }}" class="card-img-top p-3" style="height:150px; object-fit:contain;" alt="{{ badge.name }}">
                            {% else %}
                                <img src="https://via.placeholder.com/150" class="card-img-top p-3" alt="No image">
                            {% endif %}
                            <div class="card-body">
                                <h5 class="card-title">{{ badge.name }}</h5>
                                <p class="card-text">{{ badge.description }}</p>
                            </div>
                        </div>
                    </div>
                {% endfor %}
            </div>
        {% else %}
            <!-- Centered "no badges" message -->
            <p style="font-size: 1.2rem; margin-top: 30px;">No badges available yet.</p>
        {% endif %}

    </div>

</div>
{% endblock %}
