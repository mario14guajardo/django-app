{% extends "myapp/base.html" %}
{% block content %}

<!-- Full-page center alignment -->
<div class="d-flex justify-content-center align-items-center" style="min-height: 75vh;">

    <!-- Modern card container -->
    <div class="card shadow-lg p-4" style="width: 360px; border-radius: 12px;">

        <!-- Centered title -->
        <h2 class="text-center mb-4" style="font-weight: 600;">Login</h2>

        {% if error %}
            <div class="alert alert-danger text-center">{{ error }}</div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <!-- Input fields -->
            <input name="username" class="form-control mb-3" placeholder="Username" required>

            <input name="password" type="password" class="form-control mb-3" placeholder="Password" required>

            <!-- Login button -->
            <button class="btn btn-primary w-100 mb-3" style="padding: 10px; font-size: 16px;">
                Login
            </button>
        </form>

        <!-- Register link below form -->
        <p class="text-center" style="font-size: 14px;">
            Don’t have an account?
            <a href="{% url 'signup' %}">Register</a>
        </p>

    </div>
</div>

{% endblock %}
