{% extends "myapp/base.html" %}
{% block content %}

<!-- PERFECT CENTERING FIX -->
<div class="d-flex justify-content-center align-items-center w-100"
     style="position:absolute; top:50%; left:50%; transform:translate(-50%, -50%);">

    <!-- Larger modern card -->
    <div class="card shadow-lg p-5" style="width: 450px; border-radius: 16px;">

        <h1 class="text-center mb-4" style="font-weight: 700; font-size: 2.2rem;">
            Login
        </h1>

        {% if error %}
            <div class="alert alert-danger text-center">{{ error }}</div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <input name="username" class="form-control mb-4" 
                   style="height: 50px; font-size: 1.1rem;" placeholder="Username" required>

            <input name="password" type="password" class="form-control mb-4" 
                   style="height: 50px; font-size: 1.1rem;" placeholder="Password" required>

            <button class="btn btn-primary w-100 mb-4" 
                    style="padding: 14px; font-size: 1.15rem; border-radius: 6px;">
                Login
            </button>
        </form>

        <p class="text-center" style="font-size: 1rem;">
            Don’t have an account?
            <a href="{% url 'signup' %}">Register</a>
        </p>

    </div>
</div>

{% endblock %}
