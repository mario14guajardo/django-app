{% extends "myapp/base.html" %}
{% block content %}

<!-- PERFECT CENTERING -->
<div class="d-flex justify-content-center align-items-center w-100"
     style="position:absolute; top:50%; left:50%; transform:translate(-50%, -50%);">

    <!-- Matching card style -->
    <div class="card shadow-lg p-5" style="width: 480px; border-radius: 16px;">

        <!-- Title -->
        <h1 class="text-center mb-4" style="font-weight: 700; font-size: 2.2rem;">
            Create an Account
        </h1>

        {% if error %}
            <div class="alert alert-danger text-center">{{ error }}</div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <!-- Username -->
            <input type="text" name="username" 
                   class="form-control mb-4"
                   style="height: 50px; font-size: 1.1rem;"
                   placeholder="Username" required>

            <!-- Email -->
            <input type="email" name="email" 
                   class="form-control mb-4"
                   style="height: 50px; font-size: 1.1rem;"
                   placeholder="Email" required>

            <!-- Password -->
            <input type="password" name="password1" 
                   class="form-control mb-4"
                   style="height: 50px; font-size: 1.1rem;"
                   placeholder="Password" required>

            <!-- Confirm password -->
            <input type="password" name="password2"
                   class="form-control mb-4"
                   style="height: 50px; font-size: 1.1rem;"
                   placeholder="Confirm Password" required>

            <!-- Create Account Button -->
            <button class="btn btn-primary w-100 mb-4"
                    style="padding: 14px; font-size: 1.15rem; border-radius: 6px;">
                Create Account
            </button>
        </form>

        <!-- Login redirect -->
        <p class="text-center">
            Already have an account?
            <a href="{% url 'login' %}">Log in</a>
        </p>

    </div>
</div>

{% endblock %}
