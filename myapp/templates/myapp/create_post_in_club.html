{% extends "myapp/base.html" %}

{% block title %}Create Post in {{ club.name }}{% endblock %}

{% block content %}
<div class="col-md-8 mx-auto">
    <div class="card p-4 shadow-sm mb-4">
        <h2 class="fw-bold mb-3">Create a Post in {{ club.name }}</h2>

        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit" class="btn btn-primary mt-2">Post</button>
        </form>
    </div>
</div>
{% endblock %}
